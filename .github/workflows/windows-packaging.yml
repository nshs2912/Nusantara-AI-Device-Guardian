name: Windows Packaging

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "src/**"
      - "packaging/**"
      - "requirements.txt"
      - ".github/workflows/windows-packaging.yml"
  pull_request:
    branches: [main]
    paths:
      - "app.py"
      - "src/**"
      - "packaging/**"
      - "requirements.txt"
      - ".github/workflows/windows-packaging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Windows executable
        shell: powershell
        run: |
          powershell.exe -ExecutionPolicy Bypass -File .\packaging\build_windows.ps1

      - name: Smoke test packaged executable
        shell: powershell
        run: |
          $exe = Resolve-Path ".\dist\Nusantara-AI-Device-Guardian\Nusantara-AI-Device-Guardian.exe"
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:8501" -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                # Server is still starting.
              }
              if ($process.HasExited) {
                throw "Packaged executable exited before the Streamlit server became ready."
              }
            }
            if (-not $ready) {
              throw "Packaged executable did not serve HTTP 200 on port 8501 within 30 seconds."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: Nusantara-AI-Device-Guardian-windows
          path: dist/Nusantara-AI-Device-Guardian/
          if-no-files-found: error
